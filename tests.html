<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>受け入れテスト — 適正露出アシスタント</title>
  <style>
    :root {
      --paper: #F4F6F8; --panel: #FFFFFF; --ink: #0E1216; --ink-2: #4A5560;
      --rule: #C8D0D8; --ok: #0F5D4A; --alert: #96131A;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #0B0F12; --panel: #151B21; --ink: #EAF0F5; --ink-2: #97A5B1;
        --rule: #2A343D; --ok: #4FCFA8; --alert: #FF6B6B;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px; background: var(--paper); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      line-height: 1.6;
    }
    h1 { font-size: 18px; margin: 0 0 12px; }
    #summary {
      position: sticky; top: 0; background: var(--paper); padding: 8px 0 12px;
      font-size: 20px; font-weight: 700; border-bottom: 1px solid var(--rule); z-index: 1;
    }
    #summary.pass { color: var(--ok); }
    #summary.fail { color: var(--alert); }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td {
      text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule);
      vertical-align: top; font-size: 14px;
    }
    th { color: var(--ink-2); font-size: 12px; letter-spacing: .04em; }
    td.val { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
    td.res { font-weight: 700; white-space: nowrap; }
    tr.fail { background: color-mix(in srgb, var(--alert) 12%, transparent); }
    tr.fail td.res { color: var(--alert); }
    tr.pass td.res { color: var(--ok); }
    .id { color: var(--ink-2); }
    .name { max-width: 34ch; }
  </style>
</head>
<body>
  <h1>受け入れテスト（仕様 §12）</h1>
  <div id="summary">実行中…</div>
  <table>
    <thead>
      <tr><th>#</th><th class="name">内容</th><th>期待値</th><th>実測値</th><th>合否</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script type="module">
    import { F, SS, ISO, snap } from './js/stops.js';
    import { solveSS, solveN, solveISO, evTarget, handShakeLimit } from './js/exposure.js';
    import { solveND } from './js/filters.js';
    import {
      gnBase, applyModifier, applyIso, effectiveGN, reachDistance,
      calibrate, hssLoss, overStops, resolvePower, flashDuration,
    } from './js/flash.js';
    import {
      shakeWarning, overBrightWarning, isoFloorWarning, freezeWarning,
      daylightSync, slowSyncAmbient, ndCountWarnings, formatStops,
    } from './js/advisor.js';
    import { SUBJECTS, POWER_STEPS, HELP } from './js/scenes.js';
    import { compute } from './js/compute.js';
    import { makeState, migrate, mergeDeep, clampPanelSize } from './js/state.js';

    // ---- 判定ヘルパー -------------------------------------------------------
    const rel = (a, b, tol = 0.01) => Math.abs(a - b) <= Math.abs(b) * tol + 1e-9;
    const near = (a, b, tol = 0.02) => Math.abs(a - b) <= tol;
    const subjectSS = (key) => SUBJECTS.find(s => s.key === key).ss;
    const powerDur = (stops) => POWER_STEPS[stops].duration;

    // 各テストは { id, name, run } を持ち、run は { expected, actual, pass } を返す。
    const T = [];
    const add = (id, name, run) => T.push({ id, name, run });

    // ===== アンビエント ======================================================
    add(1, 'EV15 / ISO100 / F16 → SS', () => {
      const t = solveSS(15, 100, F.real(24)); // F16
      const s = snap(SS, t);
      return { expected: '1/125', actual: s.label, pass: s.label === '1/125' };
    });
    add(2, 'EV15 / ISO400 / F5.6 → SS', () => {
      const s = snap(SS, solveSS(15, 400, F.real(15))); // F5.6
      return { expected: '1/4000', actual: s.label, pass: s.label === '1/4000' };
    });
    add(3, 'EV5 / ISO1600 / F1.8 → SS', () => {
      const s = snap(SS, solveSS(5, 1600, F.real(5))); // F1.8
      return { expected: '1/160', actual: s.label, pass: s.label === '1/160' };
    });
    add(4, 'EV13 / ISO200 / SS1/250 → F', () => {
      const n = solveN(13, 200, SS.real(24)); // 1/250
      const s = snap(F, n);
      return { expected: 'F8.0 (≈8)', actual: `${s.label} (${n.toFixed(3)})`, pass: s.label === '8.0' && rel(n, 8) };
    });
    add(5, 'EV8 / F4 / SS1/60 → ISO', () => {
      const iso = solveISO(8, F.real(12), SS.real(18)); // F4, 1/60
      const s = snap(ISO, iso);
      return { expected: 'ISO400', actual: `${s.label} (${iso.toFixed(1)})`, pass: s.label === '400' && rel(iso, 400) };
    });
    // ---- isoFloorWarning は「いまアプリから呼ばれていない」関数である（意図的）----
    // 意図別ロジックは ISO を下限から上げる方向にしか動かさないので、ISO が下限を割る経路が
    // compute には無い（明るすぎ分は SS 側に出て overBrightWarning が拾う）。そのため
    // compute.js の import は外してあり、この関数を呼ぶのは #5b と #33 だけ。
    //
    // **消さずに残しているのは、将来「ISO優先」の意図を追加したときに使うため。**
    // 仕様 §9 が定義する警告で、計算自体は正しい。テストを残すことで
    // 「使っていないから壊れていても気づかない」状態を防いでいる。
    // 逆に、compute に ISO を下げる経路を足したときはここを呼び出し側の検証に格上げすること。
    add('5b', 'EV12 / F4 / SS1/60 → 連続25.0→下限50クランプ+明るすぎ警告（アプリ未使用の関数・上記コメント参照）', () => {
      const iso = solveISO(12, F.real(12), SS.real(18)); // = 25.0
      const s = snap(ISO, iso);
      const w = isoFloorWarning(iso, 50);
      const ok = rel(iso, 25) && s.clamped && rel(s.real, 50) && w && w.level === 'alert' && /明るすぎ/.test(w.message);
      return { expected: '連続25.0 / clamp→50 / alert', actual: `${iso.toFixed(1)} / clamp→${s.real} / ${w ? w.level : 'なし'}`, pass: ok };
    });
    add(6, 'EV15 / ISO100 / F16 / 補正+1 → SS', () => {
      const s = snap(SS, solveSS(15, 100, F.real(24), 1));
      return { expected: '1/60', actual: s.label, pass: s.label === '1/60' };
    });
    add(7, '200mm / 補正0 / SS1/60 → 手ブレ警告 約1.6段', () => {
      const w = shakeWarning(SS.real(18), 200, 0); // 1/60
      const ok = w && w.level === 'warn' && formatStops(w.stops) === '1.6' && /1\.6段/.test(w.message);
      return { expected: 'warn / 1.6段', actual: w ? `${w.level} / ${formatStops(w.stops)}段` : 'なし', pass: ok };
    });
    add(8, 'EV16 / ISO100 / F1.4 / SS上限1/8000 → 減光警告 2段以上', () => {
      const needed = solveSS(16, 100, F.real(3)); // F1.4
      const w = overBrightWarning(needed, SS.real(39)); // 1/8000
      const ok = w && w.level === 'alert' && rel(w.stops, 2) && /2段/.test(w.message);
      return { expected: 'alert / 2段', actual: w ? `${w.level} / ${formatStops(w.stops)}段` : 'なし', pass: ok };
    });
    add(9, 'EV15 / ISO100 / F16 / ND16(4段) → SS', () => {
      const s = snap(SS, solveSS(15, 100, F.real(24), 0, 4));
      return { expected: '1/8', actual: s.label, pass: s.label === '1/8' };
    });

    // ===== Ws → GN と校正 ====================================================
    add(10, 'Ws=100 / k=4.0 → GN', () => {
      const gn = gnBase(100, 4.0);
      return { expected: '40', actual: gn.toFixed(2), pass: rel(gn, 40) };
    });
    add(11, 'Ws=200 / k=4.0 → GN≈56.6', () => {
      const gn = gnBase(200, 4.0);
      return { expected: '≈56.57', actual: gn.toFixed(2), pass: rel(gn, 56.568) };
    });
    add(12, '#10 と #11 の段数差 = 1.0段', () => {
      const diff = 2 * Math.log2(gnBase(200, 4) / gnBase(100, 4));
      return { expected: '1.0', actual: diff.toFixed(4), pass: near(diff, 1.0, 1e-6) };
    });
    add(13, '校正 Ws200/3m/F11/ISO100/1-1 → GN33, k≈2.33', () => {
      const c = calibrate({ ws: 200, distance: 3, fAperture: 11, iso: 100, powerStops: 0 });
      const ok = rel(c.gnMeasured, 33) && rel(c.k, 2.333, 0.005);
      return { expected: 'GN33 / k≈2.33', actual: `GN${c.gnMeasured} / k${c.k.toFixed(3)}`, pass: ok };
    });
    add(14, '校正 Ws200/3m/F11/ISO400/1-4 → GN33, k≈2.33', () => {
      const c = calibrate({ ws: 200, distance: 3, fAperture: 11, iso: 400, powerStops: 2 });
      const ok = rel(c.gnAtIso100Full, 33) && rel(c.k, 2.333, 0.005);
      return { expected: 'GN33 / k≈2.33', actual: `GN${c.gnAtIso100Full.toFixed(1)} / k${c.k.toFixed(3)}`, pass: ok };
    });

    // ===== ND 組み合わせ =====================================================
    add(15, 'solveND([1,2,3,4],4) → ND16 のみ 1枚', () => {
      const r = solveND([1, 2, 3, 4], 4);
      const ok = r.count === 1 && r.totalStops === 4 && r.excess === 0;
      return { expected: '1枚 / 4段 / 超過0', actual: `${r.count}枚 / ${r.totalStops}段 / 超過${r.excess}`, pass: ok };
    });
    add(16, 'solveND([1,2,3,4],5) → ND2+ND16（濃い側から貪欲・解が一意）', () => {
      const r = solveND([1, 2, 3, 4], 5);
      // 同枚数の解（ND4+ND8）もあるが、仕様 §6 により濃い側から貪欲に選んだ解に一意化する
      const ok = r.count === 2 && r.totalStops === 5 && r.excess === 0
        && r.filters.join('+') === '1+4';
      return { expected: '2枚 / 5段 / 超過0 / [1,4]', actual: `${r.count}枚 / ${r.totalStops}段 / 超過${r.excess} / [${r.filters}]`, pass: ok };
    });
    add(17, 'solveND([1,2,3,4],8) → 3枚 合計8 + ケラレ警告', () => {
      const r = solveND([1, 2, 3, 4], 8);
      const w = ndCountWarnings(r, { baseISO: 200, expandedISOMin: 50, ownedND: [1, 2, 3, 4], wallStops: 8 });
      const kerare = w.some(x => x.level === 'warn' && /ケラレ/.test(x.message));
      const ok = r.count === 3 && r.totalStops === 8 && kerare;
      return { expected: '3枚 / 8段 / ケラレwarn', actual: `${r.count}枚 / ${r.totalStops}段 / ${kerare ? 'warnあり' : 'なし'}`, pass: ok };
    });
    add(18, 'solveND([1,2,3,4],11) → null', () => {
      const r = solveND([1, 2, 3, 4], 11);
      return { expected: 'null', actual: String(r), pass: r === null };
    });

    // ===== 日中シンクロ ======================================================
    const DS_BASE = {
      evScene: 15, iso: 200, comp: 0, syncSpeedReal: SS.real(24), // 1/250
      ownedND: [1, 2, 3, 4], ws: 200, k: 4.0, modLoss: 0,
      hssCapable: true, hssBaseLoss: 2.0, baseISO: 200, expandedISOMin: 50,
    };
    add(19, 'EV15/ISO200/同調1-250/アンビエント0/NDなし → F16', () => {
      const r = daylightSync({ ...DS_BASE, ambientOffset: 0 });
      const ok = r.fAtSync.label === '16' && rel(r.fAtSyncReal, 16);
      return { expected: 'F16', actual: `${r.fAtSync.label} (${r.fAtSyncReal.toFixed(2)})`, pass: ok };
    });
    add(20, '#19 で希望F2.8 → 同調速度の壁 約5段', () => {
      const r = daylightSync({ ...DS_BASE, ambientOffset: 0, desiredN: F.real(9) }); // F2.8
      return { expected: '≈5段', actual: r.wallStops.toFixed(3), pass: rel(r.wallStops, 5) };
    });
    add(21, '#20 ND経路 200Ws/k4/標準 ISO200 → ND2+ND16(2枚)/有効GN≈14.1/到達5.0m + 拡張ISO info', () => {
      const r = daylightSync({ ...DS_BASE, ambientOffset: 0, desiredN: F.real(9) });
      const nd = r.ndPath;
      const info = r.warnings.some(w => w.level === 'info' && /拡張/.test(w.message));
      const ok = nd.count === 2 && nd.totalStops === 5 && rel(nd.gnEff, 14.14, 0.02) && rel(nd.reach, 5.0, 0.02) && info;
      return { expected: '2枚/GN≈14.1/5.0m/info', actual: `${nd.count}枚/GN${nd.gnEff.toFixed(2)}/${nd.reach.toFixed(2)}m/${info ? 'info' : 'なし'}`, pass: ok };
    });
    add(22, '#20 HSS経路 hssBase2.0 ISO200 → SS1/8000/損失7段/有効GN≈7.07/到達2.5m', () => {
      const r = daylightSync({ ...DS_BASE, ambientOffset: 0, desiredN: F.real(9) });
      const h = r.hssPath;
      const ok = h.ss.label === '1/8000' && rel(h.hssLoss, 7) && rel(h.gnEff, 7.07, 0.02) && rel(h.reach, 2.5, 0.02);
      return { expected: '1/8000/7段/GN≈7.07/2.5m', actual: `${h.ss.label}/${h.hssLoss.toFixed(2)}段/GN${h.gnEff.toFixed(2)}/${h.reach.toFixed(2)}m`, pass: ok };
    });
    add(23, '#21 と #22 の到達距離比 = 2倍（ND経路が2段有利）', () => {
      const r = daylightSync({ ...DS_BASE, ambientOffset: 0, desiredN: F.real(9) });
      const ratio = r.ndPath.reach / r.hssPath.reach;
      return { expected: '2.0', actual: ratio.toFixed(3), pass: rel(ratio, 2.0) };
    });

    // ===== スローシンクロ ====================================================
    add(24, 'EV5/ISO400/F2.8/アンビエント−1段 → SS1/30', () => {
      const r = slowSyncAmbient({ evScene: 5, iso: 400, N: F.real(9), ambientOffset: -1 }); // F2.8
      return { expected: '1/30', actual: r.ss.label, pass: r.ss.label === '1/30' };
    });
    add(25, '#24 で焦点距離85mm・三脚なし → 手ブレ warn（約1.4段）', () => {
      const r = slowSyncAmbient({ evScene: 5, iso: 400, N: F.real(9), ambientOffset: -1 });
      const w = shakeWarning(r.ss.real, 85, 0);
      const ok = w && w.level === 'warn' && rel(w.stops, 1.4, 0.05);
      return { expected: 'warn / ≈1.4段', actual: w ? `${w.level} / ${formatStops(w.stops)}段` : 'なし', pass: ok };
    });
    add(26, '#24 の SS を 1/8 に変更 → ストロボ必要発光量が変わらない', () => {
      // ストロボ側は SS に依存しない。同じ機材条件なら SS を変えても発光量は不変。
      const gi = applyIso(applyModifier(gnBase(200, 4), 0), 400);
      const N = F.real(9), dist = 5;
      const pAt30 = resolvePower(overStops(effectiveGN(gi, 0, 0, 0), N, dist)); // SS 1/30 の文脈
      const pAt8 = resolvePower(overStops(effectiveGN(gi, 0, 0, 0), N, dist));  // SS 1/8 の文脈
      const ok = pAt30.powerStops === pAt8.powerStops;
      return { expected: '同一', actual: `1/30→${pAt30.powerStops}段 / 1/8→${pAt8.powerStops}段`, pass: ok };
    });
    add(27, '#24 に ND8(3段) 追加 → 必要発光量が3段増える', () => {
      const gi = applyIso(applyModifier(gnBase(200, 4), 0), 400);
      const N = F.real(9), dist = 5;
      const overNoND = overStops(effectiveGN(gi, 0, 0, 0), N, dist);
      const overND3 = overStops(effectiveGN(gi, 0, 3, 0), N, dist);
      const pNo = resolvePower(overNoND).powerStops;
      const pNd = resolvePower(overND3).powerStops;
      // 過剰段数が3減る＝発光量を3段上げる（powerStops が3減る）
      const ok = near(overNoND - overND3, 3, 1e-9) && (pNo - pNd) === 3;
      return { expected: '発光量 +3段', actual: `Δover=${(overNoND - overND3).toFixed(3)} / power ${pNo}→${pNd}`, pass: ok };
    });
    add(28, '発光量1/1 / 走る人(1/500) → 閃光時間1/250 → 止まりません warn', () => {
      const w = freezeWarning(powerDur(0), subjectSS('running'));
      const ok = w && w.level === 'warn' && flashDuration(0) === powerDur(0);
      return { expected: 'warn (1/250)', actual: w ? `${w.level}` : '警告なし', pass: ok };
    });
    add(29, '発光量1/32 / 走る人 → 閃光時間1/3500 → 警告なし', () => {
      const w = freezeWarning(powerDur(5), subjectSS('running'));
      return { expected: '警告なし', actual: w ? w.level : '警告なし', pass: w === null };
    });

    // ===== テーブル ==========================================================
    add(30, 'snap(SS, 16.0) → ラベル 15″, index −12', () => {
      const s = snap(SS, 16.0);
      const ok = s.label === '15″' && s.index === -12;
      return { expected: '15″ / −12', actual: `${s.label} / ${s.index}`, pass: ok };
    });
    add(31, '全系列：ラベル配列長 = 生成インデックス数', () => {
      const check = (series) => {
        const count = series.maxIndex - series.minIndex + 1;
        if (series.labels.length !== count) return false;
        for (let i = series.minIndex; i <= series.maxIndex; i++) {
          if (typeof series.label(i) !== 'string') return false;
          if (!Number.isFinite(series.real(i))) return false;
        }
        return true;
      };
      const ok = check(F) && check(SS) && check(ISO);
      const detail = `F:${F.labels.length}/${F.maxIndex - F.minIndex + 1} SS:${SS.labels.length}/${SS.maxIndex - SS.minIndex + 1} ISO:${ISO.labels.length}/${ISO.maxIndex - ISO.minIndex + 1}`;
      return { expected: '全系列一致', actual: detail, pass: ok };
    });

    // ===== ND 枚数警告（拡張ISO 導線／ケラレ）==============================
    add(32, 'ndCountWarnings: 2枚→拡張ISO info(ND1枚) / 3枚→ケラレwarn', () => {
      const two = ndCountWarnings(solveND([1, 2, 3, 4], 5), { baseISO: 200, expandedISOMin: 50, ownedND: [1, 2, 3, 4], wallStops: 5 });
      const three = ndCountWarnings(solveND([1, 2, 3, 4], 8), { baseISO: 200, expandedISOMin: 50, ownedND: [1, 2, 3, 4], wallStops: 8 });
      const twoInfo = two.some((w) => w.level === 'info' && /拡張/.test(w.message) && /ND 1枚/.test(w.message));
      const twoNoKerare = !two.some((w) => /ケラレ/.test(w.message));
      const threeInfo = three.some((w) => w.level === 'info' && /拡張/.test(w.message));
      const threeKerare = three.some((w) => w.level === 'warn' && /ケラレ/.test(w.message));
      const ok = twoInfo && twoNoKerare && threeInfo && threeKerare;
      return {
        expected: '2枚:info(ND1枚)/warnなし, 3枚:info+ケラレ',
        actual: `2枚:${twoInfo ? 'info' : '×'}/${twoNoKerare ? 'warnなし' : 'warnあり'}, 3枚:${threeInfo ? 'info' : '×'}+${threeKerare ? 'ケラレ' : '×'}`,
        pass: ok,
      };
    });

    // ======================================================================
    //  compute(state) 経由の統合テスト（末尾 c = compute を通す）
    //  純粋関数を直接呼ぶ上の群と違い、意図別ロジック・経路比較・警告の
    //  「組み立て」まで含めて検証する。ここが赤くなればアプリの表示が誤る。
    // ======================================================================
    const F28 = 2 ** (9 / 6);   // F2.8 の厳密値 2.8284
    const SYNC = 2 ** -8;       // 同調 1/250 の厳密値（1/256）

    /** 日中シンクロの基準状態（仕様 #19〜#23 と同条件）。 */
    const dayState = (patch = {}) => makeState({
      intent: 'daylightSync',
      scene: { evBase: 15, adjust: 0 },
      camera: { syncSpeed: SYNC, isoMin: 200 },
      lens: { fMin: F28 },
      profiles: makeState().profiles.map((p) => ({ ...p, powerCeilingStops: 0 })),
      flash: { profileId: 'p2', modifier: 'reflector', distance: 3, ambientOffset: 0 },
      ...patch,
    });
    /**
     * スローシンクロの基準状態。
     * 発光量の上限（既定 1/8）は物理の検証を妨げるため、ここでは 0（1/1 まで許可）にする。
     * 上限そのものの検証は #37 で行う。
     */
    const noCeiling = () => makeState().profiles.map((p) => ({ ...p, powerCeilingStops: 0 }));
    const slowState = (patch = {}) => makeState({
      intent: 'slowSync',
      subject: 'running',
      scene: { evBase: 5, adjust: 0 },
      camera: { isoMin: 400 },
      lens: { fMin: F28 },
      profiles: noCeiling(),
      flash: { profileId: 'p2', distance: 8, ambientOffset: -1, tripod: true },
      ...patch,
    });

    // ===== 発光量モード（#34〜#37）==========================================
    // 共通前提：200Ws / k=2.33（校正済み）/ 標準リフレクター / ISO200 / F2.8 / ND なし
    //   GN_base = 2.33×√200 = 32.95 ／ GN_iso = 32.95×√2 = 46.60
    const K233 = 2.33;
    const powerState = (patch = {}) => makeState({
      intent: 'slowSync',
      subject: 'static',
      scene: { evBase: 5, adjust: 0 },
      camera: { isoMin: 200 },
      lens: { fMin: F28 },
      // 校正はモディファイアごと：標準リフレクターで k=2.33 を実測した状態にする

    add('30c', 'compute 日中: HSS が SS上限で頭打ち → クランプ後SSで到達再計算＋達成可能な背景段数', () => {
      // EV14/ISO200/F2.8/背景−2段 → 理想SS 1/16384 は上限 1/8192 を超える（1段ぶん達成不能）
      const d = compute(dayState({
        scene: { evBase: 14, adjust: 0 },
        camera: { syncSpeed: SYNC, isoMin: 200, maxSS: 2 ** -13 },
        flash: { profileId: 'p1', modifier: 'reflector', distance: 2, ambientOffset: -2 },
      }));
      const h = d.paths.hss;
      // クランプ後SSから期待到達距離を独立に再計算（表示SSと到達距離の整合を検証）
      const lossFromShown = 2.0 + Math.log2(SYNC / (2 ** -13));
      const gnIso = 4.0 * Math.sqrt(100) * Math.sqrt(200 / 100);
      const reachExpect = (gnIso * 2 ** (-lossFromShown / 2)) / F28;
      const warned = d.warnings.some((w) => /SS上限/.test(w.message) && /−1\.0段/.test(w.message));
      const ok = h.ss === '1/8000' && h.ssClamped === true
        && rel(h.achievableOffset, -1.0, 0.02)
        && rel(h.lossStops, lossFromShown, 0.01)
        && rel(h.reach, reachExpect, 0.02) && warned;
      return {
        expected: `1/8000 / clamp / 背景−1.0段 / 到達${reachExpect.toFixed(2)}m / 警告`,
        actual: `${h.ss} / clamp=${h.ssClamped} / 背景${h.achievableOffset.toFixed(2)}段 / 到達${h.reach.toFixed(2)}m / ${warned ? '警告あり' : '警告なし'}`,
        pass: ok,
      };

    add('31d', 'compute 計算タブ: クランプしても不足が 1/3段未満なら警告しない', () => {

    // ===== 露出過不足の警告：1/3段の閾値と ND の組み合わせ提示 ================
    // 露出は1/3段グリッドに吸着し、ND は1段単位、目標 EV は連続値。3つが噛み合わないと
    // 必ず端数が残る。端数に警告が発火すると構造上いつまでも消えない（実機で確認された症状）。
    //
    // 残差 s 段を作る EV：ss = maxSS / 2^s となる evBase を逆算する。
    //   EV_target = log2(N² / ss) = log2(N²/maxSS) + s、evBase = EV_target − log2(ISO/100)
    const OB_F = 1.4, OB_MAXSS = 1 / 8000, OB_ISO = 200;
    const evForResidual = (s) => Math.log2((OB_F * OB_F) / OB_MAXSS) + s - Math.log2(OB_ISO / 100);
    const overBrightState = (s) => makeState({
      intent: 'blur', subject: 'static', focal: 50,
      scene: { evBase: evForResidual(s), adjust: 0 },
      camera: { isoMin: OB_ISO, maxSS: OB_MAXSS },
      lens: { fMin: OB_F, fMax: 22 },
    });
    add('W1', '露出過剰の残差が 1/6段 なら減光警告を出さない（1/3段の閾値）', () => {

      const w = d.warnings.find((x) => /明るすぎ/.test(x.message));
      // 閾値が効いた結果であることを示す（残差 0 で通っているのではない）
      const ok = !w && d.warnings.every((x) => x.helpId === HELP.ok);
      return {
        expected: '減光警告なし（残差 0.17段 < 1/3段）',
        actual: w ? w.message : `警告 ${d.warnings.map((x) => x.icon).join(',')}`,
        pass: ok,
      };
    });

      const w = d.warnings.find((x) => /明るすぎ/.test(x.message));

      const ok = !!w && w.level === 'alert' && rel(w.stops, 0.5, 0.02) && /0\.5段の減光/.test(w.message);
      return {

    add('W3', '計算タブ: 減光が必要なとき ND の組み合わせまで提示する', () => {
      // F5.6(実体 5.657) / SS 1/250(実体 1/256) / EV16.7 → 必要 ISO は下限200 より 4.7段 低い。
      // ND は整数段しかないので切り上げ 5段 → 所有[1,2,3,4] から ND2+ND16。
      // 切り上げた 0.3段ぶんは自由軸(ISO)が吸収するので、装着すれば警告は消える。
      const st = makeState({
        ui: { tab: 'calc', theme: 'auto', firstRun: false },
        scene: { evBase: 16.7, adjust: 0 },
        camera: { isoMin: 200 },
        lens: { fMin: F28, fMax: 22 },
        manual: { fIndex: 15, ssIndex: 24, isoIndex: null, locks: { f: true, ss: true, iso: false } },
        settings: { ownedND: [1, 2, 3, 4], hssBaseLoss: 2, ambientOffsetDefault: -1, comp: 0, blackMistStops: 0 },
      });
      const w = compute(st).manual.warning;
      const ok = !!w && /4\.7段超過/.test(w.message) && /ND2\+ND16（5段）を装着/.test(w.message);
      return {
        expected: '「明るすぎます（4.7段超過）。ND2+ND16（5段）を装着／…」',
        actual: w ? w.message : '警告なし',
        pass: ok,
      };
    });
    add('W3b', '計算タブ: W3 の提案どおり ND2+ND16 を装着すると警告が消える', () => {
      const base = {
        ui: { tab: 'calc', theme: 'auto', firstRun: false },
        scene: { evBase: 16.7, adjust: 0 },
        camera: { isoMin: 200 },
        lens: { fMin: F28, fMax: 22 },
        manual: { fIndex: 15, ssIndex: 24, isoIndex: null, locks: { f: true, ss: true, iso: false } },
        settings: { ownedND: [1, 2, 3, 4], hssBaseLoss: 2, ambientOffsetDefault: -1, comp: 0, blackMistStops: 0 },
      };
      // 5段ぶん暗くなるので必要 ISO は 200×2^0.3 ≒ 246。下限を上回るのでクランプしない
      const d = compute(makeState({ ...base, nd: [1, 4] }));
      const ok = d.manual.warning === null && d.ambient.ndLabel === 'ND2+ND16';
      return {
        expected: '警告なし / ND2+ND16',
        actual: `${d.manual.warning ? d.manual.warning.message : '警告なし'} / ${d.ambient.ndLabel} / ISO${d.ambient.isoLabel}`,
        pass: ok,
      };
    });

    add('W4', '行き過ぎ（暗すぎ）側も 1/3段の閾値：残差 1/6段 では出さず 0.5段 では出す', () => {
      // 風景（F8固定・ISO下限200）。SS 系列最遅 30″（実体32秒）を s 段超える EV を逆算する：
      //   ss = 64 / 2^(ev + 1) = 32·2^s  →  ev = −s
      // 明るすぎ側（W1/W2）と対称に、1/3段未満は出さず 0.5段 は出すことを1件で示す。
      const darkState = (s) => makeState({
        intent: 'landscape', subject: 'static', focal: 50,
        scene: { evBase: -s, adjust: 0 }, camera: { isoMin: 200 },
      });
      const short = (d) => d.warnings.find((x) => /暗すぎます/.test(x.message));
      const w1 = short(compute(darkState(1 / 6)));
      const w2 = short(compute(darkState(0.5)));
      const ok = !w1 && !!w2 && w2.level === 'alert' && /0\.5段 足りません/.test(w2.message);
      return {
        expected: '1/6段→警告なし / 0.5段→alert「0.5段 足りません」',
        actual: `${w1 ? w1.message : '警告なし'} ／ ${w2 ? w2.message : '警告なし'}`,
        pass: ok,
      };
    });

    // ===== 提案が別の警告を生まないこと（袋小路の解消）=======================
    // ND はアンビエントとストロボの両方に等しく効く。ストロボが足りないからと ND を外すと
    // アンビエントが明るすぎに戻る。実機で「ND を足す⇔外す」の往復になった症状の再現。
    // 自由軸 ISO は下限200に張り付いており、明るくなる余地（slack）は 0。
    const deadEndState = () => makeState({
      ui: { tab: 'calc', theme: 'auto', firstRun: false },
      intent: 'slowSync', subject: 'static',
      scene: { evBase: 16.7, adjust: 0 },
      camera: { isoMin: 200 },
      lens: { fMin: F28, fMax: 22 },
      nd: [4], // ND16
      manual: { fIndex: 15, ssIndex: 24, isoIndex: null, locks: { f: true, ss: true, iso: false } },
      profiles: makeState().profiles.map((p) => ({ ...p, powerCeilingStops: 2, minPowerStops: 7 })),
      // 距離 1.5m：フル発光時の余剰 over ≒ 1.47段。上限2段（1/4）に 0.53段 届かない。
      // over ≧ 0 なので「機材が届かない」ではなく「上限設定が邪魔している」側の分岐に入る。
      flash: { profileId: 'p1', modifier: 'reflector', distance: 1.5, ambientOffset: -1, tripod: true, powerMode: 'auto', powerStops: 5 },
    });
    add('W5', '上限超過の警告に「ND を外す」を含めない（外すと明るすぎに戻るため）', () => {
      const d = compute(deadEndState());
      const w = d.warnings.find((x) => x.helpId === HELP.powerCeiling);
      const ok = !!w && !/ND/.test(w.message) && (d.ndRemovable.slack <= 1 / 3);
      return {
        expected: '上限超過の警告あり／文面に ND を含まない（slack ≦ 1/3段）',
        actual: w ? `slack=${d.ndRemovable.slack.toFixed(2)}段 / ${w.message}` : '上限超過の警告なし',
        pass: ok,
      };
    });
    add('W6', '上限超過の第一候補が「上限を上げる」で、その上限値が必要量を満たす', () => {
      const d = compute(deadEndState());
      const w = d.warnings.find((x) => x.helpId === HELP.powerCeiling);
      // action.to が新しい上限。ここまで上げれば shortStops = max(0, 上限 − over) が 0 になる
      const over = d.flash.over;
      const firstIsRaise = !!w && /足りません。上限を .+ に上げる（発光量 .+ で撮れます）／/.test(w.message);
      const satisfies = !!w && w.action && w.action.kind === 'raiseCeiling'
        && Math.max(0, w.action.to - over) < 1e-9;
      return {
        expected: '第一候補が「上限を◯に上げる」／その上限で不足0段',
        actual: w ? `${w.action ? `to=${POWER_STEPS[w.action.to].label} (over=${over.toFixed(2)})` : 'action なし'} / ${w.message}` : '警告なし',
        pass: firstIsRaise && satisfies,
      };
    });
    add('W7', '上限超過：文言のラベルと action が設定する値が一致し、発光量も文言どおり', () => {
      // 実機で「1/1 に上げると出たのに 1/2 になった」という報告が出た組み合わせを固定する。
      // over の端数が 0.5 以上だと上限（floor）と発光量（round）が1段ずれるので、
      // その状態を作って文言・action・結果の3つが噛み合うことを確かめる。
      //   gnFull = 4.0·√100·√(200/100)/2^(4/2) = 14.142、N = F5.6(実体 5.657)
      //   over = 2·log2(14.142/(5.657·d)) を 0.6 にする d = 2.5/2^0.3 = 2.031m
      const base = deadEndState();
      const st = { ...base, flash: { ...base.flash, distance: 2.5 / 2 ** 0.3 } };
      const d = compute(st);
      const w = d.warnings.find((x) => x.helpId === HELP.powerCeiling);
      if (!w || !w.action) {
        return { expected: '上限超過の警告＋action', actual: w ? 'action なし' : '警告なし', pass: false };
      }
      const a = w.action;
      // 1) 文言に出るラベルは POWER_STEPS[a.to] と同一か（data-to はこの to をそのまま使う）
      const labelInMsg = `上限を ${POWER_STEPS[a.to].label} に上げる`;
      const labelMatches = w.message.includes(labelInMsg) && a.label === labelInMsg;
      // 2) 文言の「発光量 ◯ で撮れます」が a.resultPowerStops と一致するか
      const powerMatches = w.message.includes(`（発光量 ${POWER_STEPS[a.resultPowerStops].label} で撮れます）`);
      // 3) 実際に上限を a.to にしたら警告が消え、発光量が予告どおりになるか（ボタンの再現）
      const after = compute({ ...st, profiles: st.profiles.map((p) => ({ ...p, powerCeilingStops: a.to })) });
      const gone = !after.warnings.some((x) => x.helpId === HELP.powerCeiling);
      const asPromised = after.flash.powerLabel === POWER_STEPS[a.resultPowerStops].label;
      // ずれが起きる組み合わせ（上限 ≠ 発光量）を実際に踏んでいることも示す
      const isTheTrickyCase = a.to !== a.resultPowerStops;
      return {
        expected: `上限=発光量ではない例で 文言=action=結果（over 端数 ≧ 0.5）`,
        actual: `上限 ${POWER_STEPS[a.to].label} / 予告 ${POWER_STEPS[a.resultPowerStops].label}`
          + ` / 実際 ${after.flash.powerLabel} / 警告${gone ? '消えた' : '残った'}`
          + ` / ずれる例=${isTheTrickyCase} / ${w.message}`,
        pass: labelMatches && powerMatches && gone && asPromised && isTheTrickyCase,
      };
    });

    add('11c', 'compute: 100Ws→200Ws で到達距離がちょうど1段（√2倍）', () => {
      const a = compute(slowState({ flash: { profileId: 'p1', distance: 8, ambientOffset: -1, tripod: true } }));
      const b = compute(slowState({ flash: { profileId: 'p2', distance: 8, ambientOffset: -1, tripod: true } }));
      // reachFull＝フル発光時の到達（機材の能力）。reach は選んだ発光量で設定距離に寄るため使わない
      const stops = 2 * Math.log2(b.flash.reachFull / a.flash.reachFull); // 距離の2乗に反比例
      const ok = rel(stops, 1.0, 0.01) && rel(b.flash.reachFull / a.flash.reachFull, Math.SQRT2, 0.01);
      return { expected: '1.0段（√2倍）', actual: `${stops.toFixed(3)}段（${a.flash.reachFull.toFixed(1)}m→${b.flash.reachFull.toFixed(1)}m）`, pass: ok };
    });
    add('13c', 'compute: 校正 k=2.333（200Ws→GN33）が到達距離に反映される', () => {
      const k = 33 / Math.sqrt(200); // 仕様 #13 の校正結果 ≈2.333
      const base = compute(slowState({ flash: { profileId: 'p2', distance: 8, ambientOffset: -1, tripod: true } }));
      const cal = compute(slowState({
        flash: { profileId: 'p2', distance: 8, ambientOffset: -1, tripod: true },
        profiles: makeState().profiles.map((p) => (p.id === 'p2' ? { ...p, cal: { reflector: k } } : p)),
      }));
      // GN が k 比（2.333/4.0）になるのでフル発光時の到達距離も同じ比になる
      const ok = rel(cal.flash.reachFull / base.flash.reachFull, k / 4.0, 0.01) && cal.uncalibrated === false;
      return {
        expected: `比 ${(k / 4).toFixed(3)} / 未校正バッジ無し`,
        actual: `比 ${(cal.flash.reachFull / base.flash.reachFull).toFixed(3)} / uncalibrated=${cal.uncalibrated}`,
        pass: ok,
      };
    });
    add('24c', 'compute スロー: EV5/ISO400/F2.8/背景−1段 → SS 1/30', () => {
      const d = compute(slowState());
      return { expected: '1/30', actual: d.ambient.ssLabel, pass: d.ambient.ssLabel === '1/30' };
    });
    add('25c', 'compute スロー: 85mm・三脚なし・ISO余裕なし → 手ブレwarn 約1.4段', () => {
      const d = compute(slowState({ focal: 85, camera: { isoMin: 400, isoMax: 400 }, flash: { tripod: false, distance: 8, ambientOffset: -1, profileId: 'p2' } }));
      const w = d.warnings.find((x) => x.icon === 'shake');
      const ok = w && w.level === 'warn' && /1\.4段/.test(w.message);
      return { expected: 'warn / 1.4段', actual: w ? `${w.level} / ${w.message}` : 'なし', pass: ok };
    });
    add('26c', 'compute スロー: EV変更で SS が変わっても発光量は不変（SS非依存）', () => {
      const a = compute(slowState());                          // EV5
      const b = compute(slowState({ scene: { evBase: 8 } }));   // EV8
      const ssChanged = a.ambient.ssLabel !== b.ambient.ssLabel;
      const powerSame = a.flash.powerLabel === b.flash.powerLabel;
      return {
        expected: 'SS変化 / 発光量同一',
        actual: `SS ${a.ambient.ssLabel}→${b.ambient.ssLabel} / 発光量 ${a.flash.powerLabel}→${b.flash.powerLabel}`,
        pass: ssChanged && powerSame,
      };
    });
    add('27c', 'compute スロー: ND8 追加で SS 3段遅く＋発光量 3段強く（両系統に効く）', () => {
      const a = compute(slowState());
      const b = compute(slowState({ nd: [3] }));
      const aIdx = SS.labels.indexOf(a.ambient.ssLabel) + SS.minIndex;
      const bIdx = SS.labels.indexOf(b.ambient.ssLabel) + SS.minIndex;
      const ssSlower = (aIdx - bIdx) / 3;                       // index 3 = 1段
      const aPow = POWER_STEPS.findIndex((p) => p.label === a.flash.powerLabel);
      const bPow = POWER_STEPS.findIndex((p) => p.label === b.flash.powerLabel);
      const stronger = aPow - bPow;                             // powerStops が減る = 強くなる
      const ok = near(ssSlower, 3, 0.01) && stronger === 3;
      return { expected: 'SS 3段遅く / 発光量 3段強く', actual: `SS ${ssSlower}段 / 発光量 ${stronger}段（${a.flash.powerLabel}→${b.flash.powerLabel}）`, pass: ok };
    });
    add('28c', 'compute スロー: フル発光＋走る人 → 閃光時間で止まらないwarn', () => {
      const d = compute(slowState({ flash: { profileId: 'p1', distance: 20, ambientOffset: -1, tripod: true }, camera: { isoMin: 200 } }));
      const w = d.warnings.find((x) => /止まりません/.test(x.message));
      const ok = d.flash.powerLabel === '1/1' && w && w.level === 'warn';
      return { expected: '発光量1/1 / warn', actual: `${d.flash.powerLabel} / ${w ? w.level : '警告なし'}`, pass: ok };
    });
    add('29c', 'compute スロー: 発光量が小さければ止まる（警告なし）', () => {
      const d = compute(slowState({ flash: { profileId: 'p1', distance: 3, ambientOffset: -1, tripod: true }, camera: { isoMin: 200 } }));
      const w = d.warnings.find((x) => /止まりません/.test(x.message));
      return { expected: '警告なし', actual: w ? w.message : '警告なし', pass: !w };
    });

    // ===== 等価露出一覧（3項目・2段刻み）と拡張ISO トグル ===================
    add(47, '等価露出一覧: 開放F2.8 → F2.8/F5.6/F11 の3行がすべて等価', () => {
      const st = makeState({
        ui: { tab: 'calc', theme: 'auto', firstRun: false, manual: null, manualTray: false },
        scene: { evBase: 13, adjust: 0 }, camera: { isoMin: 200 }, lens: { fMin: F28, fMax: 22 },
      });
      const rows = compute(st).equiv;
      const labels = rows.map((r) => r.fLabel).join('/');
      // 3行とも同じ EV になっているか：EV = log2(F²/t) が一致すること
      const evs = rows.map((r) => {
        const fi = F.labels.indexOf(r.fLabel) + F.minIndex;
        const si = SS.labels.indexOf(r.ssLabel) + SS.minIndex;
        return Math.log2(F.real(fi) ** 2 / SS.real(si));
      });
      const same = evs.every((v) => near(v, evs[0], 0.2)); // 1/3段の丸め内
      const ok = rows.length === 3 && labels === '2.8/5.6/11'
        && rows.every((r) => !r.disabled) && same;
      return {
        expected: '3行 2.8/5.6/11 / 全行有効 / 同一EV',
        actual: `${rows.length}行 ${labels} / EV ${evs.map((v) => v.toFixed(2)).join(',')}`,
        pass: ok,
      };
    });
    add(48, '等価露出一覧: 開放F4.0 → F2.8 の行が理由付きで使用不可（案B）', () => {

    add(49, '拡張ISO OFF → ND が2段多く必要（ON との差が ISO200→50 の2段）', () => {

      const on = compute(dayState({ camera: { syncSpeed: SYNC, isoMin: 200, expandedISOMin: 50, allowExpandedIso: true } }));

    add(50, '拡張ISO: OFF で ND2枚なら info が出て、ON では出ず枚数が減る', () => {
      const off = compute(dayState({ camera: { syncSpeed: SYNC, isoMin: 200, expandedISOMin: 50, allowExpandedIso: false } }));

    add(54, '最小表示に残す1行：F/SS/ISO（ストロボONなら発光量も）', () => {
      // レイアウト（EVルーラー・トラックの隠し方）は検証対象外。derived に核心の数値が

      const iconOk = alertCase.summary.level === 'alert' && !!alertCase.summary.icon
        && alertCase.summary.parts.length >= 3;
      return {
        expected: 'OFF:3項目 / ON:4項目（＋発光）/ 警告時はレベルとアイコンが残る',
        actual: `OFF「${off.summary.text}」/ ON「${on.summary.text}」/ 警告 ${alertCase.summary.level}:${alertCase.summary.icon}`,

    add(55, '高さ600px未満では expanded が normal にクランプされる', () => {
      const short = clampPanelSize('expanded', 440);   // 16 Pro Max 横持ち
      const tall = clampPanelSize('expanded', 956);    // 縦持ち
      const boundary = clampPanelSize('expanded', 600); // 境界は選べる
      const keepsOthers = clampPanelSize('minimal', 440) === 'minimal'
        && clampPanelSize('normal', 440) === 'normal';
      const unknown = clampPanelSize('bogus', 956) === 'normal'; // 未知の値は標準へ
      const ok = short === 'normal' && tall === 'expanded' && boundary === 'expanded'
        && keepsOthers && unknown;
      return {
        expected: '440→normal / 600→expanded / 956→expanded / 他の段階は不変',
        actual: `440→${short} / 600→${boundary} / 956→${tall} / 他:${keepsOthers} / 未知:${unknown}`,
        pass: ok,
      };
    });
    add(52, '拡張ISO を ON→OFF に戻すと ISO 下限が 200 に戻り ND が2段増える', () => {
      // 49 は OFF/ON を個別に見るだけ。ここは「切り替えの前後で状態が残らない」ことを見る
      const base = { syncSpeed: SYNC, isoMin: 200, expandedISOMin: 50 };
      const on = dayState({ camera: { ...base, allowExpandedIso: true } });
      const back = mergeDeep(on, { camera: { allowExpandedIso: false } }); // ON の state から戻す
      const dOn = compute(on), dBack = compute(back);
      // state 層：mergeDeep が false で上書きできること（true のまま残らない）
      const stateOk = back.camera.allowExpandedIso === false;
      const ok = stateOk && dOn.ambient.isoLabel === '50' && dBack.ambient.isoLabel === '200'
        && near(dBack.paths.nd.lossStops - dOn.paths.nd.lossStops, 2, 1e-9)
        // 計算タブのクランプ下限も戻ること（isoFloorOf 経由でないと戻らない）
        && compute(mergeDeep(back, { ui: { tab: 'calc' } })).manual != null;
      return {
        expected: 'ON:ISO50 → OFF:ISO200 / ND段数 +2',
        actual: `${dOn.ambient.isoLabel}→${dBack.ambient.isoLabel} / ND ${dOn.paths.nd.lossStops}→${dBack.paths.nd.lossStops}段 / state=${back.camera.allowExpandedIso}`,
        pass: ok,
      };
    });
    add(53, '校正値が compute まで通る（200Ws/3m/F11/ISO100/フル発光 → k=2.33）', () => {
      // #13 は calibrate() 単体。ここは cal に保存した k が到達距離に反映されるまでを見る
      const c = calibrate({ ws: 200, distance: 3, fAperture: 11, iso: 100, powerStops: 0 });
      const kOk = rel(c.gnMeasured, 33) && rel(c.k, 2.333, 0.005);
      const d = compute(powerState({
        profiles: makeState().profiles.map((p) => (p.id === 'p2'
          ? { ...p, cal: { reflector: c.k }, powerCeilingStops: 3, minPowerStops: 7 } : p)),
        flash: { profileId: 'p2', modifier: 'reflector', distance: 3, ambientOffset: -1, tripod: true, powerMode: 'auto' },
      }));
      // フル発光到達 = k√Ws × √(ISO/100) ÷ F。ISO200 なので √2 倍
      const expect = (c.k * Math.sqrt(200) * Math.SQRT2) / F28;
      const ok = kOk && rel(d.flash.reachFull, expect, 0.01) && rel(expect, 16.5, 0.02)
        && d.uncalibrated === false;
      return {
        expected: `k=2.33 / フル発光到達 ${expect.toFixed(1)}m / 校正済み`,
        actual: `k=${c.k.toFixed(3)} / ${d.flash.reachFull.toFixed(1)}m / uncalibrated=${d.uncalibrated}`,
        pass: ok,
      };
    });
    add(51, '回折の境界: F11（実体11.314）は出さず F13 で出す', () => {
      // 判定は段位置で行う。素朴な fReal > 11 に戻すと F11(11.314) で発火して赤になる
      const at = (fi) => compute(makeState({
        intent: 'blur', scene: { evBase: 13, adjust: 0 }, camera: { isoMin: 200 },
        lens: { fMin: F.real(fi), fMax: 32 }, focal: 50, subject: 'static',
      }));
      const f11 = at(21), f13 = at(22);
      const has = (d) => d.warnings.some((w) => w.icon === 'diffraction');
      const ok = F.label(21) === '11' && F.label(22) === '13'
        && F.real(21) > 11              // 実体は 11 より大きい（素朴な比較なら発火する）
        && !has(f11) && has(f13)
        // 一覧側も同じ基準：F11 の行に回折フラグが付かない
        && f11.equiv.every((r) => !r.flags.includes('diffraction'));
      return {
        expected: 'F11(11.314)→なし / F13→あり / 一覧のF11行もなし',
        actual: `F11:${has(f11) ? 'あり' : 'なし'} / F13:${has(f13) ? 'あり' : 'なし'} / 実体${F.real(21).toFixed(3)}`,
        pass: ok,
      };
    });

    // ======================================================================
    //  #33 helpId の網羅性（manual.md §0.5 の対応表と実装の一致）
    // ======================================================================
    add(33, '全警告が §0.5 の表に存在する helpId を持ち、HELP の全値が発生する', async () => {
      // 1) 対応表（正典）から helpId を取得。docs を読むので code↔doc のずれも検出できる。
      const md = await (await fetch('./docs/exposure-app-manual.md')).text();
      const table = md.slice(md.indexOf('### 警告 → セクション 対応表'), md.indexOf('## 0.6'));
      const documented = new Set((table.match(/`help-[a-z0-9-]+`/g) || []).map((s) => s.replace(/`/g, '')));

      // 2) 全分岐を通す。advisor は直接呼び、compute は状態を作って呼ぶ。
      const collected = [];
      const push = (w) => { if (w) collected.push(Array.isArray(w) ? w : [w]); };
      push(shakeWarning(SS.real(18), 200, 0));                       // 手ブレ
      push(overBrightWarning(solveSS(16, 100, F.real(3)), SS.real(39))); // 明るすぎ（減光）
      push(isoFloorWarning(25, 50));                                  // ISO 下げきれない
      push(freezeWarning(POWER_STEPS[0].duration, 1 / 500));          // 閃光時間
      push(ndCountWarnings(solveND([1, 2, 3, 4], 5), { baseISO: 200, expandedISOMin: 50, ownedND: [1, 2, 3, 4], wallStops: 5 }));
      push(ndCountWarnings(solveND([1, 2, 3, 4], 8), { baseISO: 200, expandedISOMin: 50, ownedND: [1, 2, 3, 4], wallStops: 8 }));

      const scenarios = [
        // 情報系（回折・高感度・三脚）と光量不足・被写体ブレ
        makeState({ intent: 'blur', lens: { fMin: 16, fMax: 22 }, scene: { evBase: 15, adjust: 0 } }),
        makeState({ intent: 'blur', scene: { evBase: 3, adjust: 0 }, camera: { isoMin: 200, isoMax: 6400 } }),
        makeState({ intent: 'landscape', scene: { evBase: 3, adjust: 0 } }),
        makeState({ intent: 'nightHandheld', scene: { evBase: -6, adjust: 0 }, focal: 200 }),
        makeState({ intent: 'freeze', subject: 'vehicle', scene: { evBase: 5, adjust: 0 }, camera: { isoMin: 200, isoMax: 400 } }),
        makeState({ intent: 'blur', subject: 'walking', scene: { evBase: 6, adjust: 0 } }),
        // 明るすぎ（SS上限）と ISO 下限
        makeState({ intent: 'blur', scene: { evBase: 16, adjust: 0 }, lens: { fMin: 1.4, fMax: 22 } }),
        // ストロボ：過剰決定（強すぎ／足りない）・上限・最小発光量・閃光時間・後幕・チャージ
        powerState({ flash: { profileId: 'p2', modifier: 'reflector', distance: 1.5, ambientOffset: -1, tripod: true, powerMode: 'fixed', powerStops: 5 } }),
        powerState({ flash: { profileId: 'p2', modifier: 'reflector', distance: 12, ambientOffset: -1, tripod: true, powerMode: 'fixed', powerStops: 7 } }),
        // auto が上限（強い側）に当たる：0 ≦ 必要発光量 < 上限。上限2段なら 8.3〜16.5m が成立範囲
        powerState({
          profiles: makeState().profiles.map((p) => (p.id === 'p2'
            ? { ...p, cal: { reflector: K233 }, powerCeilingStops: 2, minPowerStops: 7 } : p)),
          flash: { profileId: 'p2', modifier: 'reflector', distance: 11.65, ambientOffset: -1, tripod: true, powerMode: 'auto' },
        }),
        // フル発光でも届かない（ストロボ側の物理的な光量不足）
        powerState({ flash: { profileId: 'p2', modifier: 'reflector', distance: 40, ambientOffset: -1, tripod: true, powerMode: 'auto' } }),
        powerState({ flash: { profileId: 'p2', modifier: 'reflector', distance: 0.5, ambientOffset: -1, tripod: true, powerMode: 'auto' } }),
        slowState({ flash: { profileId: 'p1', distance: 20, ambientOffset: -1, tripod: true }, camera: { isoMin: 200 } }),
        // 日中シンクロ：HSS の SS上限クランプ／壁を越えられない
        dayState({ scene: { evBase: 14, adjust: 0 }, camera: { syncSpeed: SYNC, isoMin: 200, maxSS: 2 ** -13 }, flash: { profileId: 'p1', modifier: 'reflector', distance: 2, ambientOffset: -2 } }),
        dayState({ scene: { evBase: 16, adjust: 0 }, settings: { ownedND: [1], hssBaseLoss: 2, ambientOffsetDefault: -1, comp: 0 }, profiles: makeState().profiles.map((p) => ({ ...p, hss: false })) }),
        // 計算タブ：クランプ（不足／超過）
        makeState({ ui: { tab: 'calc', theme: 'auto', firstRun: false }, scene: { evBase: 10, adjust: 0 }, camera: { isoMin: 200 }, lens: { fMin: F28, fMax: 22 }, manual: { fIndex: null, ssIndex: 27, isoIndex: 6, locks: { f: false, ss: true, iso: true } } }),
        makeState({ ui: { tab: 'calc', theme: 'auto', firstRun: false }, scene: { evBase: 16, adjust: 0 }, camera: { isoMin: 200 }, lens: { fMin: F28, fMax: 8 }, manual: { fIndex: null, ssIndex: 15, isoIndex: 6, locks: { f: false, ss: true, iso: true } } }),
        // 警告なし（この設定で撮れます）
        makeState({ intent: 'blur', scene: { evBase: 13, adjust: 0 }, focal: 24 }),
      ];
      scenarios.forEach((st) => push(compute(st).warnings));

      const all = collected.flat();
      const bad = all.filter((w) => !w.helpId || !documented.has(w.helpId));
      const produced = new Set(all.map((w) => w.helpId));
      const unreached = Object.values(HELP).filter((id) => !produced.has(id));
      const ok = all.length > 0 && bad.length === 0 && unreached.length === 0;
      return {
        expected: `全警告が表内の helpId を持つ / HELP ${Object.keys(HELP).length} 値すべて発生`,
        actual: `警告 ${all.length}件 / 表外・欠落 ${bad.length}件${bad.length ? `（${bad.map((w) => w.helpId || 'なし').join(',')}）` : ''} / 未到達 ${unreached.length}件${unreached.length ? `（${unreached.join(',')}）` : ''}`,
        pass: ok,
      };
    });

    // ---- 実行 & 描画 --------------------------------------------------------
    const rows = document.getElementById('rows');
    let passed = 0;
    for (const test of T) {
      let r;
      try {
        // 非同期テスト（#33 は docs を読む）も同じ経路で扱う
        r = await test.run();
      } catch (e) {
        r = { expected: '(実行成功)', actual: `例外: ${e.message}`, pass: false };
      }
      if (r.pass) passed++;
      const tr = document.createElement('tr');
      tr.className = r.pass ? 'pass' : 'fail';
      tr.innerHTML =
        `<td class="id">${test.id}</td>` +
        `<td class="name">${test.name}</td>` +
        `<td class="val">${r.expected}</td>` +
        `<td class="val">${r.actual}</td>` +
        `<td class="res">${r.pass ? '✓ 成功' : '✗ 失敗'}</td>`;
      rows.appendChild(tr);
    }
    const summary = document.getElementById('summary');
    summary.textContent = `全 ${T.length} 件中 ${passed} 件成功`;
    summary.className = passed === T.length ? 'pass' : 'fail';
  </script>
</body>
</html>
