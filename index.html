<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="露出アシスト">
  <meta name="theme-color" content="#F4F6F8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0F12" media="(prefers-color-scheme: dark)">
  <title>露出アシスト</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <!-- ===== SVG シンボル集（外部アイコン禁止のため自前定義）===== -->
  <svg style="display:none" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-tab-easy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="7" x2="20" y2="7"/><circle cx="9" cy="7" r="2"/>
        <line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2"/>
        <line x1="4" y1="17" x2="20" y2="17"/><circle cx="8" cy="17" r="2"/>
      </symbol>
      <symbol id="i-tab-calc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8" y1="7" x2="16" y2="7"/>
        <line x1="8" y1="12" x2="8" y2="12"/><line x1="12" y1="12" x2="12" y2="12"/><line x1="16" y1="12" x2="16" y2="12"/>
        <line x1="8" y1="16" x2="8" y2="16"/><line x1="12" y1="16" x2="12" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/>
      </symbol>
      <symbol id="i-tab-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>
      </symbol>
      <symbol id="i-shake" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12c1.5-3 3-3 4.5 0S10.5 15 12 12s3-3 4.5 0S19.5 9 21 6"/>
      </symbol>
      <symbol id="i-motion" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="8" x2="13" y2="8"/><line x1="5" y1="12" x2="15" y2="12"/><line x1="3" y1="16" x2="13" y2="16"/>
        <path d="M15 6l5 6-5 6"/>
      </symbol>
      <symbol id="i-diffraction" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="2"/><path d="M12 6a6 6 0 0 1 6 6M12 4a8 8 0 0 1 8 8M12 18a6 6 0 0 1-6-6M12 20a8 8 0 0 1-8-8"/>
      </symbol>
      <symbol id="i-noise" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="7" r=".6"/><circle cx="11" cy="5" r=".6"/><circle cx="17" cy="8" r=".6"/><circle cx="8" cy="12" r=".6"/>
        <circle cx="14" cy="12" r=".6"/><circle cx="19" cy="13" r=".6"/><circle cx="6" cy="17" r=".6"/><circle cx="12" cy="18" r=".6"/><circle cx="18" cy="18" r=".6"/>
      </symbol>
      <symbol id="i-flash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2 4 14h6l-1 8 9-12h-6z"/>
      </symbol>
      <symbol id="i-nd" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8"/><path d="M6.3 6.3 17.7 17.7"/><path d="M12 4a8 8 0 0 1 0 16" fill="currentColor" fill-opacity=".18" stroke="none"/>
      </symbol>
      <symbol id="i-hss" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 2 3 13h5l-1 9 8-12h-5z"/><path d="M18 4v6M21 4v6" stroke-width="1.2"/>
      </symbol>
      <symbol id="i-tripod" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4v9"/><rect x="8" y="3" width="8" height="3" rx="1"/><path d="M12 13 5 21M12 13l7 8M9.5 17h5"/>
      </symbol>
      <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><circle cx="12" cy="15.5" r="1"/>
      </symbol>
      <symbol id="i-unlock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/><circle cx="12" cy="15.5" r="1"/>
      </symbol>
      <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="8" r=".6"/>
      </symbol>
      <symbol id="i-warn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3 2 20h20z"/><line x1="12" y1="9" x2="12" y2="14"/><circle cx="12" cy="17" r=".6"/>
      </symbol>
      <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3h8l5 5v8l-5 5H8l-5-5V8z"/><line x1="12" y1="8" x2="12" y2="13"/><circle cx="12" cy="16" r=".6"/>
      </symbol>
    </defs>
  </svg>

  <!-- ===== 更新バー（新SW検出時のみ表示。自動リロードしない）===== -->
  <div id="update-bar" class="update-bar" hidden role="status">
    <span>新しいバージョンがあります</span>
    <button type="button" id="update-apply" class="update-apply">更新</button>
  </div>

  <!-- ===== ヘッダー（固定）===== -->
  <header class="app-header">
    <div class="tabs" role="tablist" aria-label="画面切り替え">
      <button class="tab" role="tab" id="tab-btn-easy" aria-controls="tab-easy" aria-selected="true" data-tab="easy">
        <svg class="icon" aria-hidden="true"><use href="#i-tab-easy"></use></svg><span>かんたん</span>
      </button>
      <button class="tab" role="tab" id="tab-btn-calc" aria-controls="tab-calc" aria-selected="false" tabindex="-1" data-tab="calc">
        <svg class="icon" aria-hidden="true"><use href="#i-tab-calc"></use></svg><span>計算</span>
      </button>
      <button class="tab" role="tab" id="tab-btn-settings" aria-controls="tab-settings" aria-selected="false" tabindex="-1" data-tab="settings">
        <svg class="icon" aria-hidden="true"><use href="#i-tab-settings"></use></svg><span>設定</span>
      </button>
    </div>
    <div class="header-right">
      <div class="ev-readout" aria-label="現在のシーン EV"><span class="ev-label">EV</span><span id="ev-value" class="ev-num">–</span></div>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="テーマ切り替え（自動）" title="テーマ">
        <svg class="icon" aria-hidden="true"><use href="#i-tab-settings"></use></svg>
      </button>
    </div>
  </header>

  <!-- ===== スクロール領域（タブごとのパネル）===== -->
  <main class="scroll-body" id="scroll-body">
    <!-- タブ1 かんたん -->
    <section class="panel-tab" id="tab-easy" role="tabpanel" aria-labelledby="tab-btn-easy">
      <div class="field">
        <div class="field-label" id="lbl-scene">シーン</div>
        <div class="tile-row" id="scene-tiles" role="radiogroup" aria-labelledby="lbl-scene"></div>
      </div>
      <div class="field">
        <label class="field-label" for="scene-adjust">微調整<span class="field-value" id="scene-adjust-val">0.0段</span></label>
        <!-- 値の単位は「1/3段」。-6〜+6 が ±2段。step=1 で 1/3段スナップを構造的に担保 -->
        <input class="slider" type="range" id="scene-adjust" min="-6" max="6" step="1" value="0"
               aria-describedby="scene-adjust-val">
        <div class="slider-scale"><span>−2</span><span>0</span><span>+2</span></div>
      </div>
      <div class="field">
        <div class="field-label" id="lbl-focal">焦点距離</div>
        <div class="chip-row" id="focal-chips" role="radiogroup" aria-labelledby="lbl-focal"></div>
      </div>
      <div class="field">
        <div class="field-label" id="lbl-intent">意図</div>
        <div class="chip-row" id="intent-chips" role="radiogroup" aria-labelledby="lbl-intent"></div>
      </div>
      <div class="field" id="subject-field" hidden>
        <div class="field-label" id="lbl-subject">止めたい被写体</div>
        <div class="chip-row" id="subject-chips" role="radiogroup" aria-labelledby="lbl-subject"></div>
      </div>

      <!-- ストロボパネル（日中/スローシンクロで展開）-->
      <div class="flash-panel" id="flash-panel" hidden>
        <div class="field-label flash-head"><svg class="icon" aria-hidden="true"><use href="#i-flash"></use></svg>ストロボ</div>
        <div class="field">
          <label class="field-label" for="flash-profile">プロファイル</label>
          <select class="select" id="flash-profile"></select>
          <span class="badge badge-est" id="uncalibrated-badge" hidden>推定値（未校正）</span>
        </div>
        <div class="field">
          <label class="field-label" for="flash-modifier">モディファイア</label>
          <select class="select" id="flash-modifier"></select>
        </div>
        <div class="field">
          <div class="field-label" id="lbl-distance">ストロボ→被写体の距離</div>
          <div class="chip-row" id="distance-chips" role="radiogroup" aria-labelledby="lbl-distance"></div>
        </div>
        <div class="field">
          <div class="field-label" id="lbl-power">発光量<span class="field-value caption" id="power-hint"></span></div>
          <div class="chip-row" id="power-chips" role="radiogroup" aria-labelledby="lbl-power"></div>
        </div>
        <div class="field">
          <div class="field-label" id="lbl-ambient">背景（アンビエント目標段数）</div>
          <div class="chip-row" id="ambient-chips" role="radiogroup" aria-labelledby="lbl-ambient"></div>
        </div>
        <div class="field toggle-field" id="tripod-field" hidden>
          <span class="field-label">三脚</span>
          <button type="button" class="toggle" id="tripod-toggle" role="switch" aria-checked="false" aria-label="三脚使用">
            <span class="toggle-knob"></span></button>
        </div>
        <div class="field toggle-field" id="curtain-field" hidden>
          <span class="field-label">後幕シンクロ</span>
          <button type="button" class="toggle" id="curtain-toggle" role="switch" aria-checked="false" aria-label="後幕シンクロ">
            <span class="toggle-knob"></span></button>
        </div>
      </div>
    </section>

    <!-- タブ2 計算 -->
    <section class="panel-tab" id="tab-calc" role="tabpanel" aria-labelledby="tab-btn-calc" hidden>
      <div class="field">
        <label class="field-label" for="calc-ev">シーン EV（タブ1から引き継ぎ・直接入力可）</label>
        <input class="input" id="calc-ev" type="text" inputmode="decimal" autocomplete="off">
        <div class="field-error" id="calc-ev-err" aria-live="polite"></div>
      </div>
      <div class="field">
        <div class="field-label" id="lbl-calc-nd">ND 装着</div>
        <div class="chip-row" id="calc-nd-chips" role="group" aria-labelledby="lbl-calc-nd"></div>
      </div>
      <div class="calc-tracks" id="calc-tracks" aria-label="F/SS/ISO ホイール">
        <!-- ui.js が3本のロック付きホイールを差し込む -->
      </div>
      <div class="field">
        <div class="field-label">等価露出の組み合わせ</div>
        <div class="equiv-list" id="equiv-list"></div>
      </div>
    </section>

    <!-- タブ3 設定 -->
    <section class="panel-tab" id="tab-settings" role="tabpanel" aria-labelledby="tab-btn-settings" hidden>
      <div id="settings-root"><!-- ui.js が生成 --></div>
    </section>
  </main>

  <!-- ===== 結果パネル（固定・常時表示）===== -->
  <section class="result-panel" id="result-panel" aria-label="計算結果">
    <div class="result-head">
      <div class="wall-readout" id="wall-readout" hidden>
        <span class="wall-label">同調速度の壁</span><span class="wall-num" id="wall-num">–</span>
      </div>
      <div class="result-badges" id="result-badges"></div>
    </div>
    <div class="ev-ruler" id="ev-ruler" aria-hidden="false"><!-- EVルーラー＋トラック --></div>
    <div class="result-systems" id="result-systems" aria-live="polite"><!-- アンビエント／ストロボ --></div>
    <div class="path-compare" id="path-compare" hidden></div>
    <div class="warnings" id="warnings" role="status"></div>
  </section>

  <!-- ===== トースト（クランプ通知など）===== -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- ===== 初回セットアップ（初回のみ表示）===== -->
  <div class="setup-overlay" id="setup-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="setup-title">
    <div class="setup-card">
      <h2 class="setup-title" id="setup-title">機材セットアップ</h2>
      <div class="setup-body" id="setup-body"></div>
      <div class="setup-actions">
        <button type="button" class="btn btn-ghost" id="setup-skip">全部あとで</button>
        <div class="setup-nav">
          <button type="button" class="btn btn-ghost" id="setup-later">あとで</button>
          <button type="button" class="btn btn-primary" id="setup-next">次へ</button>
        </div>
      </div>
      <div class="setup-dots" id="setup-dots" aria-hidden="true"></div>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
